[build]
  publish = "demo/static"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — все несущ. маршруты на index.html (не нужен, но на всякий)
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
